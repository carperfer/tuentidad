name: Recordatorios de eventos

# Cada hora, la aplicación avisa (en la web y por email) a quienes van o
# quizás van a un evento que empieza en las próximas 24 horas
# (POST /api/deploy/reminders con el token de despliegue). Cada evento se
# recuerda una sola vez, así que un retraso o una ejecución de más no repite avisos.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  recordatorios:
    runs-on: ubuntu-latest
    environment: produccion
    if: vars.DESPLIEGUE == 'app'
    steps:
      - name: Enviar recordatorios
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'https://tuentidad.es/' }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" "${APP_BASE_URL%/}/api/deploy/reminders"
