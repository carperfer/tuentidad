name: Copia de seguridad

# Copia diaria de la base de datos de producción. La hace la propia aplicación
# (POST /api/deploy/backup con el token de despliegue) y la guarda en
# tuentidad/writable/backups del servidor, fuera de la web; se conservan las
# 14 más recientes y se descargan por SFTP. No se suben a GitHub: en un
# repositorio público, los artefactos de los workflows los puede bajar cualquiera.

on:
  schedule:
    # 03:30 UTC
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    environment: produccion
    if: vars.DESPLIEGUE == 'app'
    steps:
      - name: Crear copia
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'https://tuentidad.es/' }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" "${APP_BASE_URL%/}/api/deploy/backup"
