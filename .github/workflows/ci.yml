name: CI — Validación de Pull Request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test y build
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código del PR
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Detectar tipo de proyecto
      - name: Detectar tipo de proyecto
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f composer.json ]; then
            echo "has_php=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_php=false" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------------
      # Node.js / React (frontend)
      # ----------------------------------------------------------------
      - name: Configurar Node.js
        if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias Node
        if: steps.detect.outputs.has_node == 'true'
        run: npm ci

      - name: Lint (Node)
        if: steps.detect.outputs.has_node == 'true'
        run: |
          if npm run lint --if-present 2>/dev/null; then
            echo "✅ Lint completado"
          else
            echo "ℹ️  Sin script de lint definido — omitiendo"
          fi

      - name: Tests (Node)
        if: steps.detect.outputs.has_node == 'true'
        run: |
          if npm test --if-present 2>/dev/null; then
            echo "✅ Tests completados"
          else
            echo "ℹ️  Sin script de test definido — omitiendo"
          fi

      - name: Build (Node)
        if: steps.detect.outputs.has_node == 'true'
        run: |
          if npm run build --if-present 2>/dev/null; then
            echo "✅ Build completado"
          else
            echo "ℹ️  Sin script de build definido — omitiendo"
          fi

      # ----------------------------------------------------------------
      # PHP / Backend
      # ----------------------------------------------------------------
      - name: Configurar PHP
        if: steps.detect.outputs.has_php == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: Instalar dependencias PHP
        if: steps.detect.outputs.has_php == 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP (syntax check)
        if: steps.detect.outputs.has_php == 'true'
        run: find . -name "*.php" -not -path "*/vendor/*" -print0 | xargs -0 -r php -l

      - name: Tests PHP
        if: steps.detect.outputs.has_php == 'true'
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --no-coverage
          elif [ -f artisan ]; then
            php artisan test
          else
            echo "ℹ️  Sin framework de tests PHP detectado — omitiendo"
          fi

      # ----------------------------------------------------------------
      # Proyecto sin manifiestos (fase inicial / solo docs)
      # ----------------------------------------------------------------
      - name: Sin manifiestos de build detectados
        if: |
          steps.detect.outputs.has_node == 'false' &&
          steps.detect.outputs.has_php == 'false'
        run: |
          echo "ℹ️  No se detectó package.json ni composer.json."
          echo "ℹ️  El proyecto está en fase inicial de documentación."
          echo "ℹ️  Este workflow está preparado para ejecutar lint/test/build"
          echo "ℹ️  en cuanto se añadan los manifiestos correspondientes."
          echo ""
          echo "✅  Validación de estructura de documentación:"
          for doc in README.md docs/development-workflow.md docs/production-ssh-access.md .env.example .devcontainer/devcontainer.json; do
            if [ -f "$doc" ]; then
              echo "  ✅  $doc presente"
            else
              echo "  ⚠️   $doc no encontrado"
            fi
          done
