<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyecto en construcción</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(160deg, var(--bg), #1f2937);
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(680px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
      font-size: 1rem;
    }

    .badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      font-size: 0.85rem;
      border: 1px solid rgba(34, 197, 94, 0.35);
      letter-spacing: .2px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">En desarrollo</div>
    <h1>Estamos construyendo algo nuevo</h1>
    <p>
      Este proyecto se encuentra actualmente en construcción.
      Muy pronto estará disponible con más información y nuevas funcionalidades.
      Gracias por tu paciencia.
    </p>
  </main>
</body>
</html>
