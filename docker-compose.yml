services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      CI_ENVIRONMENT: development
      app_baseURL: http://localhost:8080/
      database_default_hostname: db
      database_default_database: tuentidad
      database_default_username: tuentidad
      database_default_password: tuentidad
      database_default_DBDriver: MySQLi
      database_tests_hostname: db
      database_tests_database: tuentidad_test
      database_tests_username: tuentidad
      database_tests_password: tuentidad
      database_tests_DBDriver: MySQLi
      database_tests_DBPrefix: ""
      # Los emails se capturan en Mailpit: http://localhost:8025
      email_protocol: smtp
      email_SMTPHost: mailpit
      email_SMTPPort: 1025
      email_SMTPCrypto: ""
      email_fromEmail: no-reply@tuentidad.local
      email_fromName: tuentidad
      # Enlaces de los emails hacia la SPA de Vite: en Codespaces, la URL reenviada
      # del puerto 5173; fuera, localhost:5173. Se puede forzar con TUENTIDAD_PUBLIC_URL.
      tuentidad_publicURL: ${TUENTIDAD_PUBLIC_URL:-${CODESPACE_NAME:+https://${CODESPACE_NAME}-5173.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}/}}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tuentidad
      MYSQL_USER: tuentidad
      MYSQL_PASSWORD: tuentidad
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  db-data:
